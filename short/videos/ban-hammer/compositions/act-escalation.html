      <script>
        (function () {
          "use strict";
          // Global start of this act; every position below is written in GLOBAL

          var T0 = 4;
          var raw = gsap.timeline({ paused: true });
          var root = document.getElementById("act-escalation-root");
          BH.buildWorlds(root);
          BH.buildAvatars(root);
          var K = BH.kit(raw, T0);
          var tl = K.tl, say = K.say, cam = K.cam, glitch = K.glitch, fire = K.fire, glowPulse = K.glowPulse;
          var $ = BH.$, $$ = BH.$$, BEAT = BH.BEAT, STEP = BH.STEP;
          var t;
  var burst8 = BH.buildBurst("#s8-burst", 26, 8);
  // Leaderboard counter: a setter object, so a tl.set() rewrites the text on seek.
  var s9n = $("#s9-n");
  var counter = {};
  var countValue = 11;
  Object.defineProperty(counter, "n", {
    get: function () {
      return countValue;
    },
    set: function (v) {
      countValue = v;
      s9n.textContent = Math.round(v) + "/12";
    },
  });
  // Player-count chip in S8: 12/12 -> 11/12
  $("#s8-n").innerHTML =
    '<span id="s8-n1" style="position:absolute;left:0;right:0">12/12</span>' +
    '<span id="s8-n2" style="position:absolute;left:0;right:0;color:#ff1e27;opacity:0">11/12</span>';

  // S4 4.0-5.5 - chat blows up. Slow shift-lock push 1.5 -> 1.9.

  cam("#s4-cam", "540px 1450px", { scale: 1.2 }, { scale: 1.4 }, t, 0.15, "expo.out");
  tl.to("#s4-cam", { scale: 1.6, duration: 1.35, ease: "power1.in" }, t + 0.15);
  tl.fromTo("#s4-me .arm.r", { rotation: -20 }, { rotation: -32, duration: 1.5, ease: "sine.inOut" }, t);
  tl.fromTo("#s4-chat", { x: -900 }, { x: 0, duration: 0.16, ease: "expo.out" }, t);
  ["#s4-l1", "#s4-l2", "#s4-l3"].forEach(function (l, i) {
    tl.fromTo(l, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.08, ease: "power2.out" }, t + i * BEAT * 0.5);
  });
  say("#s4-a", "left", t + STEP, 5.5);
  say("#s4-b", "right", t + 2 * STEP, 5.5);
  // S5 5.5-6.5 - ADMIN JOINED (alarm + boom).
  t = 5.5;
  cam("#s5-cam", "540px 1000px", { scale: 1.75, rotation: -4 }, { scale: 1.5, rotation: 0 }, t, 0.25, "expo.out");
  tl.to("#s5-cam", { scale: 1.6, duration: 0.75, ease: "none" }, t + 0.25);
  tl.fromTo("#s5-banner", { scaleY: 0, rotation: -4 }, { scaleY: 1, rotation: -4, duration: 0.12, ease: "power4.out" }, t);
  tl.to("#s5-banner", { rotation: -2, scale: 1.04, duration: 0.88, ease: "none" }, t + 0.12);
  tl.fromTo("#s5-admin", { y: -1300 }, { y: 0, duration: 0.12, ease: "power3.in" }, t);
  tl.fromTo("#s5-me", { x: 0 }, { x: -40, duration: 0.2, ease: "power2.out" }, t + 0.12);
  tl.fromTo("#s5-me .arm.r", { rotation: -20 }, { rotation: -20, duration: 0.01 }, t);
  // S6 6.5-8.0 - "DROP IT. NOW." Accelerating push onto the admin (speed ramp).
  t = 6.5;
  cam("#s6-cam", "540px 960px", { scale: 1.5, rotation: -2 }, { scale: 2, rotation: 2 }, t, 1.5, "power2.in");
  tl.fromTo("#s6-admin .arm.r", { rotation: 0 }, { rotation: -100, duration: 0.2, ease: "back.out(2)" }, t + 0.1);
  tl.fromTo("#s6-bubble", { scale: 0, rotation: -6, transformOrigin: "50% 100%" }, { scale: 1, rotation: -2, duration: 0.2, ease: "back.out(2.5)" }, t);
  tl.to("#s6-bubble", { rotation: 1, duration: 1.3, ease: "none" }, t + 0.2);
  tl.fromTo("#s6-bubble span:last-child", { scale: 1 }, { scale: 1.18, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out" }, 7.0);
  tl.to("#s6-bubble span:last-child", { scale: 1.18, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out" }, 7.5);
  // S7 8.0-9.0 - over-the-shoulder shift-lock swing: slow wind-up, then snap.
  t = 8;

  tl.to("#s7-cam", { scale: 1.9, duration: 0.25, ease: "expo.in" }, t + 0.75);
  tl.fromTo("#s7-me", { scale: 2.6, x: -60, transformOrigin: "50% 100%" }, { scale: 2.7, x: -40, duration: 1, ease: "none" }, t);
  tl.set("#s7-me .held", { rotation: 180, transformOrigin: "50% 100%" }, t);

  tl.fromTo("#s8-admin", { x: 0, y: 0, rotation: 0, scale: 1 }, { x: 760, y: -1150, rotation: 900, scale: 0.3, duration: 0.7, ease: "power2.out" }, t);
  fire(burst8, t, 0.7);
  say("#s8-a", "stamp", t + 0.02, 10.0, 1.08);

  t = 10;

  var strikeTimes = [10.0, 10.36, 10.66, 10.9, 11.08, 11.22, 11.33, 11.42, 11.46, 11.49];
  var rows = $$("#s9-lb p");
  tl.set(counter, { n: 11 }, t);
  strikeTimes.forEach(function (st, i) {
    var row = rows[i + 2];
    tl.fromTo(row.querySelector(".strike"), { scaleX: 0 }, { scaleX: 1, duration: 0.05, ease: "none" }, st);
    tl.fromTo(row, { opacity: 1, x: 0 }, { opacity: 0.45, x: 18, duration: 0.05, ease: "none" }, st);
    tl.set(counter, { n: 10 - i }, st);
  });
  say("#s9-a", "left", t, 11.5);
  say("#s9-b", "right", t + STEP, 11.5);
  // S10 11.5-13.0 - empty obby, "1/12". Slow lonely push 1.0 -> 1.5.
  t = 11.5;
  cam("#s10-cam", "540px 1040px", { scale: 1, rotation: 0 }, { scale: 1.5, rotation: -2 }, t, 1.5, "power1.inOut");
  tl.fromTo("#s10-me", { y: 0 }, { y: -10, duration: 0.75, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);

  say("#s10-a", "rise", t + STEP, 13.0, 1.04);
  say("#s10-b", "rise", t + 2 * STEP, 13.0, 1.04);
  // S11 13.0-14.5 - the hammer turns to face camera; eyes open on the stinger.
  t = 13;
  cam("#s11-cam", "540px 700px", { scale: 1 }, { scale: 1.25 }, t, 1.5, "power1.in");

  glowPulse("#s11-h .hglow", t, 1.5);

  say("#s11-b", "drop", t + STEP, 14.5);
  say("#s11-c", "stamp", t + BEAT, 14.5, 1.08);

          window.__timelines["act-escalation"] = raw;
        })();
